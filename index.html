<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beIN SPORTS Maroc</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #1a202c; /* brand-bg */
      color: #e2e8f0; /* brand-text */
    }
    .loader {
      border: 4px solid #4a5568; /* a shade of gray */
      border-top: 4px solid #be1770; /* brand-primary */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .carousel-scrollbar::-webkit-scrollbar {
      height: 8px;
    }
    .carousel-scrollbar::-webkit-scrollbar-track {
      background: #2d3748; /* slate-800 */
      border-radius: 10px;
    }
    .carousel-scrollbar::-webkit-scrollbar-thumb {
      background: #4a5568; /* slate-600 */
      border-radius: 10px;
    }
    .carousel-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #718096; /* slate-500 */
    }
  </style>

      "i18next-browser-languagedetector": "https://aistudiocdn.com/i18next-browser-languagedetector@^8.2.0",
      "i18next-http-backend": "https://aistudiocdn.com/i18next-http-backend@^3.0.2"
    }
  }
  </script>
</head>
